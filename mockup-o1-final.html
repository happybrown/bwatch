<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Watch 6 — O1 Final (세이프 존 적용)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #16181d; color: #e8eaed;
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    padding: 40px 20px; display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .sub { color: #9aa0a6; font-size: 14px; margin-bottom: 24px; text-align:center; max-width:680px; line-height:1.6;}
  .toolbar { margin-bottom: 30px; display:flex; gap:18px; align-items:center; font-size:14px; color:#c2c6cc;}
  .toolbar label { cursor:pointer; user-select:none; display:flex; gap:7px; align-items:center;}
  .row { display:flex; gap:64px; flex-wrap:wrap; justify-content:center; }
  .item { display:flex; flex-direction:column; align-items:center; }
  .cap { margin-top:16px; font-size:13px; color:#9aa0a6; }

  /* 워치: 내부 좌표계를 480 기준으로 두고 통째로 0.78 축소 → 세이프 존 계산이 480px 기준으로 정확 */
  .stage { width: 374px; height: 374px; position: relative; }   /* 480 * 0.78 = 374.4 */
  .watch {
    width: 480px; height: 480px; border-radius: 50%; background: #000; position: absolute;
    top:0; left:0; transform: scale(0.78); transform-origin: top left;
    box-shadow: 0 0 0 13px #2a2c31, 0 0 0 17px #3a3d44, 0 18px 50px rgba(0,0,0,.65); overflow: hidden;
  }
  .face { position:absolute; inset:0; background: radial-gradient(120% 120% at 50% 0%, #122a45 0%, #060810 58%, #000 100%); }
  .mono { font-variant-numeric: tabular-nums; letter-spacing:-3px; }

  /* --- 시간: 원이 가장 넓은 세로 중앙 근처에 배치 --- */
  .timewrap { position:absolute; top:150px; left:0; right:0; text-align:center; }
  .time { font-size: 150px; font-weight: 800; line-height:.82;
    background: linear-gradient(135deg, #6fd2ff 0%, #a78bfa 55%, #f0abfc 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 2px 12px rgba(120,160,255,.22)); }
  .ampm { font-size: 30px; font-weight: 700; color:#8fb6ff; letter-spacing:2px; margin-top:8px; }

  /* --- 하단 카드: 세이프 존 안쪽(폭 좁아지는 구간) 고려해 너비/위치 조정 --- */
  .cards { position:absolute; left:90px; right:90px; bottom:74px; display:flex; gap:12px; justify-content:center; }
  .card {
    flex:1; background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10);
    border-radius:22px; padding:13px 4px 15px; text-align:center;
    backdrop-filter: blur(6px); box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }
  .card .k{ font-size:13px; color:#8b93a3; letter-spacing:1.5px; font-weight:600; }
  .card .v{ font-size:25px; font-weight:700; color:#fff; margin-top:4px; }
  .card .v.day{ background:linear-gradient(135deg,#6fd2ff,#a78bfa); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .card .v.bt{ color:#34d399; }
  .card .bbar{ height:5px; border-radius:3px; background:rgba(255,255,255,.12); margin:9px 14px 0; position:relative;}
  .card .bbar i{ position:absolute; left:0; top:0; bottom:0; width:68%; border-radius:3px; background:linear-gradient(90deg,#34d399,#6fd2ff);}

  /* --- 세이프 존 가이드 (내접 원/사각형) --- */
  .guide { position:absolute; inset:0; pointer-events:none; display:none; }
  .guide.on { display:block; }
  .guide .circle { position:absolute; inset:0; border-radius:50%; box-shadow: inset 0 0 0 2px rgba(255,80,80,.55); }
  /* 내접 정사각형: 변 = 직경/√2 ≈ 339px, 중앙 정렬 */
  .guide .square { position:absolute; width:339px; height:339px; left:70.5px; top:70.5px; border:2px dashed rgba(255,210,80,.7); }
  .guide .lbl { position:absolute; bottom:8px; left:0; right:0; text-align:center; font-size:12px; color:rgba(255,210,80,.85); }
</style>
</head>
<body>
  <h1>Galaxy Watch 6 · O1 Gradient Glass Cards — 최종안</h1>
  <div class="sub">원형 디스플레이에서 글자·카드가 잘리지 않도록, 모든 요소를 <b>내접 영역(세이프 존)</b> 안에 배치했습니다.
  시간은 원이 가장 넓은 세로 중앙 근처에, 카드는 폭이 좁아지는 하단을 고려해 좌우 여백을 넉넉히 줬습니다. (예시 10:08 PM · 배터리 68%)</div>

  <div class="toolbar">
    <label><input type="checkbox" id="g1"> 빨간 원 = 화면 외곽 / 노란 점선 = 내접 안전 사각형 표시</label>
  </div>

  <div class="row">
    <div class="item">
      <div class="stage">
        <div class="watch">
          <div class="face">
            <div class="timewrap">
              <div class="time mono">10:08</div>
              <div class="ampm">PM</div>
            </div>
            <div class="cards">
              <div class="card"><div class="k">DATE</div><div class="v">JUN 29</div></div>
              <div class="card"><div class="k">DAY</div><div class="v day">MON</div></div>
              <div class="card"><div class="k">BATTERY</div><div class="v bt">68%</div><div class="bbar"><i></i></div></div>
            </div>
            <div class="guide" id="gd">
              <div class="circle"></div>
              <div class="square"></div>
              <div class="lbl">SAFE ZONE</div>
            </div>
          </div>
        </div>
      </div>
      <div class="cap">44mm · 480×480 기준 (40mm 432×432도 동일 비율로 자동 대응)</div>
    </div>
  </div>

  <script>
    document.getElementById('g1').addEventListener('change', function(e){
      document.getElementById('gd').classList.toggle('on', e.target.checked);
    });
  </script>
</body>
</html>
